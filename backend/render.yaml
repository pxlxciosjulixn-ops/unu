# Configuracion del backend en Render.
#
# Render solo lee blueprints desde un `render.yaml` en la raiz del repo; este
# archivo esta aqui, junto al `frontend/render.yaml`, como referencia de lo que
# hay que poner en el panel (New > Web Service > Docker). Si algun dia quieres
# manejar todo por blueprint, mueve este contenido a la raiz junto con el del
# frontend, teniendo en cuenta que Render intentara crear los servicios que no
# existan.
services:
  - type: web
    name: unu-backend
    runtime: docker
    # La raiz del repo es `unu/`, que contiene `frontend/` y `backend/`.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    # El health check entra por HTTP interno; settings.py exime esta ruta del
    # redirect a HTTPS para que no responda 301.
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Orígenes del frontend ya desplegado, separados por comas.
      # Ej: https://unu-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # URL *interna* de la base (dpg-...-a, sin dominio): no sale a internet y
      # es mas rapida que la externa.
      - key: DATABASE_URL
        sync: false
      # Se pega en el panel. Nunca en el repo.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: deepseek-ai/deepseek-v4-flash-0731
      # Dos procesos con ocho hilos cada uno caben en el plan gratis y aguantan
      # las respuestas largas del chat.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "8"

services:
  - type: web
    name: unu-frontend
    runtime: static
    # La raiz del repo es `unu/`, que contiene `frontend/` y `backend/`.
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22.17.0"
      # URL publica del backend de Django que sirve /api/dashboard/.
      # Se define en el panel de Render; sin ella el dashboard apunta a localhost.
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback: cualquier ruta desconocida sirve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
